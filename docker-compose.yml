services:

  backend:
    build:
      context: ./BackEnd
    container_name: code-reviewer-backend
    
    env_file:
      - ./BackEnd/.env
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEnd
    container_name: code-reviewer-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped